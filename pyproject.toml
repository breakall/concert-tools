[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "concert-tools"
version = "0.1.0"
description = "Inspect, validate, and safely transform Apple MainStage concert bundles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "breakall" }]
keywords = ["mainstage", "concert", "music", "file-format"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
concert-tools = "concert_tools.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
